<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Garde-Manger & Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding-bottom: 70px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .bought-item { text-decoration: line-through; color: #adb5bd; }
        .nav-pills .nav-link.active { background-color: #198754; }
        .nav-pills .nav-link { color: #198754; font-weight: 500; }
        .badge-frigo { background-color: #0dcaf0; color: #000; }
        .badge-congel { background-color: #0d6efd; color: #fff; }
        .badge-placard { background-color: #ffc107; color: #000; }
    </style>
</head>
<body>

<div class="container mt-4" style="max-width: 800px;">
    <h2 class="text-center mb-4 fw-bold text-success">🛒 Mon Garde-Manger</h2>

    {% if user %}
    <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-2 px-3 rounded shadow-sm">
        <span class="text-muted small">Connecté en tant que : <strong>{{ user.get('name', user.get('email')) }}</strong></span>
        <a href="/logout" class="btn btn-sm btn-outline-danger">Déconnexion</a>
    </div>
    {% endif %}

    <!-- Navigation -->
    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded shadow-sm" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="tab-courses" data-bs-toggle="pill" data-bs-target="#courses" type="button">📝 Courses</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-stock" data-bs-toggle="pill" data-bs-target="#stock" type="button">📦 Stocks (Frigo/Placard)</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="tab-budget" data-bs-toggle="pill" data-bs-target="#budget" type="button">💶 Budget</button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
        
        <!-- ONGLET 1 : LISTE DE COURSES -->
        <div class="tab-pane fade show active" id="courses">
            <div class="card p-3">
                <form id="form-shopping" class="row g-2">
                    <div class="col-6 col-md-5">
                        <input type="text" id="shop-name" class="form-control" placeholder="Article (ex: Lait)" required>
                    </div>
                    <div class="col-6 col-md-3">
                        <input type="text" id="shop-qty" class="form-control" placeholder="Qté (ex: 2L)">
                    </div>
                    <div class="col-8 col-md-2">
                        <input type="number" step="0.01" id="shop-price" class="form-control" placeholder="Prix ₪">
                    </div>
                    <div class="col-4 col-md-2">
                        <button type="submit" class="btn btn-success w-100">+</button>
                    </div>
                </form>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <button class="btn btn-sm btn-outline-success" onclick="aiSortShopping()">✨ Trier par IA</button>
                <div>
                    <span class="text-muted">Estimation panier :</span>
                    <span class="fw-bold fs-5 text-success" id="total-estimated">0.00 ₪</span>
                </div>
            </div>

            <ul class="list-group shadow-sm" id="shopping-list"></ul>
        </div>

        <!-- ONGLET 2 : STOCKS -->
        <div class="tab-pane fade" id="stock">
            <div class="card p-3">
                <form id="form-inventory" class="row g-2">
                    <div class="col-12 col-md-4">
                        <input type="text" id="inv-name" class="form-control" placeholder="Produit (ex: Pâtes)" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="text" id="inv-qty" class="form-control" placeholder="Qté">
                    </div>
                    <div class="col-6 col-md-3">
                        <select id="inv-loc" class="form-select">
                            <option value="Frigo">🧊 Frigo</option>
                            <option value="Congélateur">❄️ Congélateur</option>
                            <option value="Placard">🥫 Placard</option>
                        </select>
                    </div>
                    <div class="col-8 col-md-2">
                        <input type="date" id="inv-date" class="form-control" title="Date de péremption">
                    </div>
                    <div class="col-4 col-md-1">
                        <button type="submit" class="btn btn-primary w-100">+</button>
                    </div>
                </form>
            </div>

            <div id="inventory-list"></div>
        </div>

        <!-- ONGLET 3 : BUDGET -->
        <div class="tab-pane fade" id="budget">
            <div class="card p-3 text-center bg-success text-white">
                <h6 class="text-uppercase mb-1">Dépenses du mois en cours</h6>
                <h2 class="fw-bold mb-0" id="monthly-total">0.00 ₪</h2>
            </div>

            <div class="card p-3">
                <form id="form-expense" class="row g-2">
                    <div class="col-12 col-md-5">
                        <input type="text" id="exp-desc" class="form-control" placeholder="Magasin / Détail (ex: Rami Levy)" required>
                    </div>
                    <div class="col-6 col-md-3">
                        <input type="number" step="0.01" id="exp-amount" class="form-control" placeholder="Montant ₪" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <input type="date" id="exp-date" class="form-control">
                    </div>
                    <div class="col-12 col-md-2">
                        <button type="submit" class="btn btn-dark w-100">Ajouter</button>
                    </div>
                </form>
            </div>

            <ul class="list-group shadow-sm" id="expense-list"></ul>
        </div>

    </div>
</div>

<!-- Modal d'édition unique -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Modifier l'élément</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modal-edit-id">
                <input type="hidden" id="modal-edit-type">
                
                <div class="mb-3">
                    <label class="form-label text-muted small">Nom</label>
                    <input type="text" id="modal-edit-name" class="form-control">
                </div>
                <div class="mb-3" id="field-qty-container">
                    <label class="form-label text-muted small">Quantité</label>
                    <input type="text" id="modal-edit-qty" class="form-control">
                </div>
                <div class="mb-3" id="field-extra-container">
                    <label class="form-label text-muted small" id="label-extra">Prix ₪</label>
                    <input type="text" id="modal-edit-extra" class="form-control">
                </div>
                <div class="mb-3" id="field-date-container" style="display:none;">
                    <label class="form-label text-muted small">Date</label>
                    <input type="date" id="modal-edit-date" class="form-control">
                </div>
                <div class="mb-3" id="field-loc-container" style="display:none;">
                    <label class="form-label text-muted small">Emplacement</label>
                    <select id="modal-edit-loc" class="form-select">
                        <option value="Frigo">🧊 Frigo</option>
                        <option value="Congélateur">❄️ Congélateur</option>
                        <option value="Placard">🥫 Placard</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-success" onclick="saveModalChanges()">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const editModal = new bootstrap.Modal(document.getElementById('editModal'));

    function openEditModal(type, id, name, extra1, extra2, extra3) {
        document.getElementById('modal-edit-type').value = type;
        document.getElementById('modal-edit-id').value = id;
        document.getElementById('modal-edit-name').value = name;
        
        const qtyContainer = document.getElementById('field-qty-container');
        const extraContainer = document.getElementById('field-extra-container');
        const dateContainer = document.getElementById('field-date-container');
        const locContainer = document.getElementById('field-loc-container');
        
        qtyContainer.style.display = 'block';
        extraContainer.style.display = 'block';
        dateContainer.style.display = 'none';
        locContainer.style.display = 'none';

        if (type === 'shopping') {
            document.getElementById('label-extra').innerText = 'Prix estimé (₪)';
            document.getElementById('modal-edit-qty').value = extra1;
            document.getElementById('modal-edit-extra').value = extra2;
        } else if (type === 'inventory') {
            qtyContainer.style.display = 'block';
            extraContainer.style.display = 'none';
            dateContainer.style.display = 'block';
            locContainer.style.display = 'block';
            document.getElementById('modal-edit-qty').value = extra1;
            document.getElementById('modal-edit-loc').value = extra2;
            document.getElementById('modal-edit-date').value = extra3;
        } else if (type === 'expense') {
            qtyContainer.style.display = 'none';
            document.getElementById('label-extra').innerText = 'Montant (₪)';
            document.getElementById('modal-edit-extra').value = extra1;
            dateContainer.style.display = 'block';
            document.getElementById('modal-edit-date').value = extra2;
        }
        
        editModal.show();
    }

    async function saveModalChanges() {
        const type = document.getElementById('modal-edit-type').value;
        const id = document.getElementById('modal-edit-id').value;
        const name = document.getElementById('modal-edit-name').value;
        
        let url = '';
        let bodyData = {};

        if (type === 'shopping') {
            url = `/api/shopping/${id}`;
            bodyData = {
                name: name,
                quantity: document.getElementById('modal-edit-qty').value,
                estimated_price: document.getElementById('modal-edit-extra').value,
                bought: false
            };
        } else if (type === 'inventory') {
            url = `/api/inventory/${id}`;
            bodyData = {
                name: name,
                quantity: document.getElementById('modal-edit-qty').value,
                location: document.getElementById('modal-edit-loc').value,
                expiry_date: document.getElementById('modal-edit-date').value
            };
        } else if (type === 'expense') {
            url = `/api/expenses/${id}`;
            bodyData = {
                description: name,
                amount: document.getElementById('modal-edit-extra').value,
                date: document.getElementById('modal-edit-date').value
            };
        }

        const response = await fetch(url, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(bodyData)
        });

        if (response.ok) {
            editModal.hide();
            if (type === 'shopping') loadShopping();
            if (type === 'inventory') loadInventory();
            if (type === 'expense') loadExpenses();
        }
    }

    // --- COURSES & TRI IA ---
    async function loadShopping() {
        const res = await fetch('/api/shopping');
        const items = await res.json();
        renderShoppingList(items);
    }

async function aiSortShopping() {
    const list = document.getElementById('shopping-list');
    list.innerHTML = '<li class="list-group-item text-center text-muted py-3">🤖 L\'IA analyse et trie ta liste...</li>';

    try {
        const res = await fetch('/api/shopping/ai-sort', { method: 'POST' });
        const data = await res.json();
        
        // Dictionnaire local de secours (mode réduit intelligent)
        const getLocalCategory = (name) => {
            const n = name.toLowerCase();
            if (['avocat', 'tomate', 'pomme', 'banane', 'salade', 'carotte', 'oignon', 'citron', 'concombre', 'courgette'].some(w => n.includes(w))) return '🍎 Fruits & Légumes';
            if (['lait', cottage','beurre', 'fromage', 'yaourt', 'crème', 'œufs', 'oeuf', 'mozzarella'].some(w => n.includes(w))) return '🧀 Produits Frais & Laitiers';
            if (['viande', 'poulet', 'bœuf', 'steak', 'jambon', 'poisson', 'saumon'].some(w => n.includes(w))) return '🥩 Boucherie & Poissonnerie';
            if (['moutarde','pâtes', 'riz', 'farine', 'sucre', 'huile', 'cracottes', 'crackers', 'conserve', 'sauce', 'café', 'thé', 'chocolat', 'gâteau', 'pain'].some(w => n.includes(w))) return '🥫 Épicerie & Sec';
            if (['papier', 'savon', 'shampoing', 'lessive', 'dentifrice', 'éponge', 'sac'].some(w => n.includes(w))) return '🧻 Hygiène & Entretien';
            return '🛒 Autres Rayons';
        };

        let sortedCategories = {};
        let allItems = data.items;
        let isFallback = data.fallback;

        if (isFallback) {
            // Mode réduit : on trie localement avec le dictionnaire
            allItems.forEach(item => {
                const cat = getLocalCategory(item.name);
                if (!sortedCategories[cat]) sortedCategories[cat] = [];
                sortedCategories[cat].push(item.name);
            });
        } else {
            // Mode IA réussi
            let rawText = data.result.replace(/```json/g, '').replace(/```/g, '').trim();
            sortedCategories = JSON.parse(rawText);
        }

        list.innerHTML = '';
        let total = 0;

        // Affichage d'un avertissement si on est en mode secours
        if (isFallback) {
            const alertLi = document.createElement('li');
            alertLi.className = 'list-group-item alert alert-warning py-2 mb-2 small text-center';
            alertLi.innerHTML = '⚠️ L\'IA n\'est pas dispo (surcharge), voici une version de tri en mode dégradé.';
            list.appendChild(alertLi);
        }

        for (const [rayon, articleNames] of Object.entries(sortedCategories)) {
            const matchingItems = allItems.filter(i => articleNames.map(n => n.toLowerCase()).includes(i.name.toLowerCase()));
            
            if (matchingItems.length > 0) {
                const headerLi = document.createElement('li');
                headerLi.className = 'list-group-item bg-light text-success fw-bold small text-uppercase py-1';
                headerLi.innerText = rayon;
                list.appendChild(headerLi);

                matchingItems.forEach(item => {
                    if (!item.bought) total += item.estimated_price;
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center ps-4';
                    li.innerHTML = `
                        <div class="form-check d-flex align-items-center gap-2">
                            <input class="form-check-input" type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleBought(${item.id}, this.checked)">
                            <label class="form-check-label ${item.bought ? 'bought-item' : ''}">
                                <strong>${item.name}</strong> ${item.quantity ? '(' + item.quantity + ')' : ''}
                            </label>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-light text-dark">${item.estimated_price.toFixed(2)} ₪</span>
                            <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('shopping', ${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.quantity || ''}', ${item.estimated_price})">Modifier</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteShopping(${item.id})">✕</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }
        }
        document.getElementById('total-estimated').innerText = total.toFixed(2) + ' ₪';
    } catch (err) {
        console.error(err);
        loadShopping();
    }
}

    function renderShoppingList(items) {
        const list = document.getElementById('shopping-list');
        list.innerHTML = '';
        let total = 0;

        items.forEach(item => {
            if (!item.bought) total += item.estimated_price;
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <div class="form-check d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleBought(${item.id}, this.checked)">
                    <label class="form-check-label ${item.bought ? 'bought-item' : ''}">
                        <strong>${item.name}</strong> ${item.quantity ? '(' + item.quantity + ')' : ''}
                    </label>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-light text-dark">${item.estimated_price.toFixed(2)} ₪</span>
                    <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('shopping', ${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.quantity || ''}', ${item.estimated_price})">Modifier</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteShopping(${item.id})">✕</button>
                </div>
            `;
            list.appendChild(li);
        });
        document.getElementById('total-estimated').innerText = total.toFixed(2) + ' ₪';
    }

    document.getElementById('form-shopping').addEventListener('submit', async (e) => {
        e.preventDefault();
        await fetch('/api/shopping', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('shop-name').value,
                quantity: document.getElementById('shop-qty').value,
                estimated_price: document.getElementById('shop-price').value
            })
        });
        e.target.reset();
        loadShopping();
    });

    async function toggleBought(id, bought) {
        await fetch(`/api/shopping/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({bought: bought ? 1 : 0})
        });
        loadShopping();
    }

    async function deleteShopping(id) {
        await fetch(`/api/shopping/${id}`, {method: 'DELETE'});
        loadShopping();
    }

    // --- STOCKS ---
    async function loadInventory() {
        const res = await fetch('/api/inventory');
        const items = await res.json();
        const container = document.getElementById('inventory-list');
        container.innerHTML = '';

        items.forEach(item => {
            let badgeClass = 'badge-frigo';
            if (item.location === 'Congélateur') badgeClass = 'badge-congel';
            if (item.location === 'Placard') badgeClass = 'badge-placard';

            const card = document.createElement('div');
            card.className = 'card p-2 mb-2 d-flex flex-row justify-content-between align-items-center';
            card.innerHTML = `
                <div>
                    <span class="badge ${badgeClass} me-2">${item.location}</span>
                    <strong>${item.name}</strong> ${item.quantity ? '- ' + item.quantity : ''}
                    ${item.expiry_date ? `<small class="text-muted d-block ms-1">Péremption : ${item.expiry_date}</small>` : ''}
                </div>
                <div class="d-flex gap-1">
                    <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('inventory', ${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.quantity || ''}', '${item.location}', '${item.expiry_date || ''}')">Modifier</button>
                    <button class="btn btn-sm btn-outline-warning text-dark fw-semibold" onclick="finishInventory(${item.id}, '${item.name.replace(/'/g, "\\'")}', '${item.quantity || ''}')">Fini</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    document.getElementById('form-inventory').addEventListener('submit', async (e) => {
        e.preventDefault();
        await fetch('/api/inventory', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('inv-name').value,
                quantity: document.getElementById('inv-qty').value,
                location: document.getElementById('inv-loc').value,
                expiry_date: document.getElementById('inv-date').value
            })
        });
        e.target.reset();
        loadInventory();
    });

    async function finishInventory(id, name, quantity) {
        const addToShopping = confirm(`"${name}" est terminé.\n\nSouhaitez-vous l'ajouter automatiquement à votre liste de courses ?`);
        if (addToShopping) {
            await fetch('/api/shopping', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, quantity: quantity, estimated_price: 0})
            });
        }
        await fetch(`/api/inventory/${id}`, {method: 'DELETE'});
        loadInventory();
        loadShopping();
    }

    // --- BUDGET ---
    async function loadExpenses() {
        const res = await fetch('/api/expenses');
        const items = await res.json();
        const list = document.getElementById('expense-list');
        list.innerHTML = '';
        
        const currentMonth = new Date().toISOString().slice(0, 7);
        let monthlyTotal = 0;

        items.forEach(item => {
            if (item.date.startsWith(currentMonth)) {
                monthlyTotal += item.amount;
            }
            const li = document.createElement('li');
            li.className = 'list-group-item d-flex justify-content-between align-items-center';
            li.innerHTML = `
                <div>
                    <strong>${item.description}</strong>
                    <small class="text-muted d-block">${item.date}</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold">${item.amount.toFixed(2)} ₪</span>
                    <button class="btn btn-sm btn-outline-primary" onclick="openEditModal('expense', ${item.id}, '${item.description.replace(/'/g, "\\'")}', ${item.amount}, '${item.date}')">Modifier</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteExpense(${item.id})">✕</button>
                </div>
            `;
            list.appendChild(li);
        });
        document.getElementById('monthly-total').innerText = monthlyTotal.toFixed(2) + ' ₪';
    }

    document.getElementById('form-expense').addEventListener('submit', async (e) => {
        e.preventDefault();
        await fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                description: document.getElementById('exp-desc').value,
                amount: document.getElementById('exp-amount').value,
                date: document.getElementById('exp-date').value
            })
        });
        e.target.reset();
        loadExpenses();
    });

    async function deleteExpense(id) {
        await fetch(`/api/expenses/${id}`, {method: 'DELETE'});
        loadExpenses();
    }

    // Initialisation
    loadShopping();
    loadInventory();
    loadExpenses();
</script>
</body>
</html>
